services:
    app:
        build:
            context: .
            dockerfile: Dockerfile

        image: portafolio-yhc
        container_name: portafolio-yhc-app

        ports:
            - "8000:80"

        env_file:
            - .env.docker

        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost"]
            interval: 30s
            timeout: 10s
            retries: 3
